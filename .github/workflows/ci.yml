name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One CI run per branch/PR; superseded runs are cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is .nvmrc / package.json engines, 20 is what the Pages deploy uses
        node: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          for f in dist/index.html dist/data-export.html dist/data-export; do
            if [ ! -s "$f" ]; then
              echo "::error::expected build artifact missing or empty: $f"
              exit 1
            fi
          done
          echo "dist size: $(du -sh dist | cut -f1)"

      - name: Upload build output
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run eslint

  api-service:
    name: API service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-service/package-lock.json

      - name: Install dependencies
        working-directory: api-service
        run: npm ci

      - name: Syntax check
        working-directory: api-service
        run: |
          for f in *.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Boot check
        working-directory: api-service
        env:
          PORT: 8080
        run: |
          node server.js &
          pid=$!
          for i in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:8080/health" >/dev/null 2>&1; then
              echo "server responded on /health"
              kill $pid
              exit 0
            fi
            if ! kill -0 $pid 2>/dev/null; then
              echo "::error::server exited before becoming ready"
              wait $pid
              exit 1
            fi
            sleep 1
          done
          echo "::error::server did not respond within 20s"
          kill $pid
          exit 1
